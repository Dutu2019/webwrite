<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Socratic Tutor</title>
  <style>
    body { font-family: system-ui; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    select, textarea, button { font-size: 16px; width: 100%; margin: 8px 0; padding: 8px; }
    #feedback { margin-top: 16px; padding: 16px; border-radius: 8px; background: #f3f4f6; min-height: 40px; }
    .temp { font-weight: bold; font-size: 20px; }
  </style>
</head>
<body>
  <h1>Socratic Homework Tutor</h1>
  <label>Question:</label>
  <select id="question"></select>
  <p id="prompt"></p>
  <textarea id="answer" rows="4" placeholder="Type your answer..."></textarea>
  <button onclick="check()">Check (attempt <span id="n">1</span>)</button>
  <div id="feedback"></div>

<script>
let attempt = 1;
let questions = [];

async function load() {
  questions = await (await fetch("/questions")).json();
  const sel = document.getElementById("question");
  questions.forEach(q => sel.add(new Option(q.prompt.slice(0, 50) + "...", q.id)));
  showPrompt();
  sel.onchange = () => { attempt = 1; document.getElementById("n").textContent = 1; showPrompt(); };
}
function showPrompt() {
  const id = document.getElementById("question").value;
  document.getElementById("prompt").textContent = questions.find(q => q.id === id).prompt;
}
async function check() {
  const id = document.getElementById("question").value;
  const answer = document.getElementById("answer").value;
  const res = await fetch("/check", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question_id: id, student_answer: answer, attempt })
  });
  const d = await res.json();
  const colors = { cold:"#3b82f6", cool:"#06b6d4", warm:"#f59e0b", hot:"#ef4444", correct:"#22c55e" };
  document.getElementById("feedback").innerHTML =
    `<div class="temp" style="color:${colors[d.temperature]}">${d.temperature.toUpperCase()} — ${d.closeness}%</div>
     <p>${d.hint}</p>` + (d.is_correct ? "<p>✅ Correct!</p>" : "");
  attempt++;
  document.getElementById("n").textContent = attempt;
}
load();
</script>
</body>
</html>
